# readit share Worker. One-time account setup is in worker/README.md.
name = "readit-share"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# Svelte bundle copied from dist/assets by `bun run build:worker`.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "SHARES"
bucket_name = "readit-shares"

# Brute-force protection for POST /s/{id}/unlock, keyed by share id + IP.
[[ratelimits]]
name = "UNLOCK_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true

# Secrets (set with `wrangler secret put <NAME>` in this directory):
#   PUBLISH_TOKEN  bearer token the CLI sends to /api/shares/*
#   COOKIE_SECRET  HMAC key for the password-unlock cookie
